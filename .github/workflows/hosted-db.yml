name: Hosted database

# Manual only. Applying migrations to a hosted project is not something that
# should happen on every push, and never as a side effect of opening a PR.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to run migrations against the hosted project'
        required: true
        default: ""

concurrency:
  # Never let two runs push migrations to the same project at once.
  group: hosted-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  converge:
    name: Apply migrations and prove hosted state
    runs-on: ubuntu-latest

    # The Supabase credentials are GitHub *Environment* secrets, not repository
    # secrets. Environment secrets are only exposed to a job that declares the
    # environment — without this line every `secrets.*` below resolves to an
    # empty string and preflight reports them all missing, which is exactly what
    # the first two dispatches did.
    environment: Los Afrique

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check the confirmation input
        if: inputs.confirm != 'apply'
        run: |
          echo "::error::Refusing to run. Re-dispatch with confirm = apply."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Fail early and name what is missing, rather than surfacing an opaque
      # CLI error three steps later.
      - name: Preflight — required secrets
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # The project ref is the subdomain of the project URL. Deriving it
          # rather than requiring it separately removes one secret to set, and
          # removes the possibility of a ref that disagrees with the URL —
          # which would link one project and probe another.
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            derived=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" \
              | sed -E 's#^https?://##; s#\..*$##')
            if [ -z "$derived" ]; then
              echo "::error::Could not derive a project ref from NEXT_PUBLIC_SUPABASE_URL"
              echo "($NEXT_PUBLIC_SUPABASE_URL). Set SUPABASE_PROJECT_REF explicitly."
              exit 1
            fi
            echo "SUPABASE_PROJECT_REF=$derived" >> "$GITHUB_ENV"
            echo "Derived project ref from the project URL: $derived"
          else
            echo "Using the supplied SUPABASE_PROJECT_REF."
          fi

          # Required, not optional. The project's direct host is IPv6-only and
          # GitHub runners have no IPv6 route — run 3 failed with
          # `connect ENETUNREACH 2600:1f10:…:5432` after migrations had already
          # applied. The pooled string is reachable over IPv4.
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            echo "The migration push can reach the project through the CLI, but the"
            echo "hosted probes connect directly, and db.<ref>.supabase.co is IPv6-only."
            echo "Copy the Session pooler string from the project's Connect dialog and"
            echo "store it as the SUPABASE_DB_URL secret."
            exit 1
          fi
          echo "Preflight OK."

      - name: Show migrations this run will apply
        run: ls -1 supabase/migrations/

      # Skipped when SUPABASE_DB_URL is supplied: pushing by connection string
      # needs no link, and avoids guessing direct-vs-pooler hosts entirely.
      - name: Link to the project
        if: env.SUPABASE_DB_URL == ''
        run: |
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      # Shows exactly what the next step will apply, before it applies it.
      - name: Preview migrations (dry run)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase db push --db-url "$SUPABASE_DB_URL" \
              --include-all --skip-vault --dry-run
          else
            npx supabase db push --linked --include-all --skip-vault --dry-run
          fi

      # Applies pending migrations in order. It does not reset, drop or recreate
      # anything — that is deliberate, and `db reset` must never appear here.
      #
      # --skip-vault matters: without it, `db push` updates the project's vault
      # secrets from config.toml before running migrations. config.toml here is
      # the stock CLI default, so that would rewrite project configuration this
      # workflow has no business touching.
      #
      # --include-seed is likewise omitted: no seed data is pushed.
      - name: Apply migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase db push --db-url "$SUPABASE_DB_URL" \
              --include-all --skip-vault
          else
            npx supabase db push --linked --include-all --skip-vault
          fi

      - name: Hosted migration history
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase migration list --db-url "$SUPABASE_DB_URL" || true
          else
            npx supabase migration list --linked || true
          fi

      - name: Prove hosted schema, RLS and two-user isolation
        run: npm run test:hosted

      - name: Summary
        if: always()
        run: |
          {
            echo "### Hosted database convergence"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repo migrations | $(ls -1 supabase/migrations/*.sql | wc -l) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
