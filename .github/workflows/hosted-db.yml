name: Hosted database

# Manual only. Applying migrations to a hosted project is not something that
# should happen on every push, and never as a side effect of opening a PR.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to run migrations against the hosted project'
        required: true
        default: ""

concurrency:
  # Never let two runs push migrations to the same project at once.
  group: hosted-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  converge:
    name: Apply migrations and prove hosted state
    runs-on: ubuntu-latest

    # The Supabase credentials are GitHub *Environment* secrets, not repository
    # secrets. Environment secrets are only exposed to a job that declares the
    # environment — without this line every `secrets.*` below resolves to an
    # empty string and preflight reports them all missing, which is exactly what
    # the first two dispatches did.
    environment: Los Afrique

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check the confirmation input
        if: inputs.confirm != 'apply'
        run: |
          echo "::error::Refusing to run. Re-dispatch with confirm = apply."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Fail early and name what is missing, rather than surfacing an opaque
      # CLI error three steps later.
      - name: Preflight — required secrets
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # The project ref is the subdomain of the project URL. Deriving it
          # rather than requiring it separately removes one secret to set, and
          # removes the possibility of a ref that disagrees with the URL —
          # which would link one project and probe another.
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            derived=$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" \
              | sed -E 's#^https?://##; s#\..*$##')
            if [ -z "$derived" ]; then
              echo "::error::Could not derive a project ref from NEXT_PUBLIC_SUPABASE_URL"
              echo "($NEXT_PUBLIC_SUPABASE_URL). Set SUPABASE_PROJECT_REF explicitly."
              exit 1
            fi
            echo "SUPABASE_PROJECT_REF=$derived" >> "$GITHUB_ENV"
            echo "Derived project ref from the project URL: $derived"
          else
            echo "Using the supplied SUPABASE_PROJECT_REF."
          fi

          # Required, not optional. The project's direct host is IPv6-only and
          # GitHub runners have no IPv6 route — run 3 failed with
          # `connect ENETUNREACH 2600:1f10:…:5432` after migrations had already
          # applied. The pooled string is reachable over IPv4.
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set."
            echo "The migration push can reach the project through the CLI, but the"
            echo "hosted probes connect directly, and db.<ref>.supabase.co is IPv6-only."
            echo "Copy the Session pooler string from the project's Connect dialog and"
            echo "store it as the SUPABASE_DB_URL secret."
            exit 1
          fi
          echo "Preflight OK."

      # Supabase's Connect dialog hands you the string with a literal
      # [YOUR-PASSWORD] placeholder. Substituting it by hand is where this goes
      # wrong: a password containing @ : / ? # or & silently corrupts the URL,
      # and a rotated password leaves the old one embedded. Both surface only as
      # "password authentication failed", which names the wrong cause.
      #
      # So paste the string verbatim, placeholder and all, and let this fill in
      # SUPABASE_DB_PASSWORD with correct percent-encoding.
      - name: Resolve the database URL
        run: |
          RESOLVED=$(python3 "$GITHUB_WORKSPACE/scripts/resolve-db-url.py") || exit 1
          echo "::add-mask::$RESOLVED"
          echo "RESOLVED_DB_URL=$RESOLVED" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/resolve-db-url.py" --describe

      - name: Show migrations this run will apply
        run: ls -1 supabase/migrations/

      # Skipped when SUPABASE_DB_URL is supplied: pushing by connection string
      # needs no link, and avoids guessing direct-vs-pooler hosts entirely.
      - name: Link to the project
        if: env.SUPABASE_DB_URL == ''
        run: |
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      # Shows exactly what the next step will apply, before it applies it.
      - name: Preview migrations (dry run)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase db push --db-url "$RESOLVED_DB_URL" \
              --include-all --skip-vault --dry-run
          else
            npx supabase db push --linked --include-all --skip-vault --dry-run
          fi

      # Applies pending migrations in order. It does not reset, drop or recreate
      # anything — that is deliberate, and `db reset` must never appear here.
      #
      # --skip-vault matters: without it, `db push` updates the project's vault
      # secrets from config.toml before running migrations. config.toml here is
      # the stock CLI default, so that would rewrite project configuration this
      # workflow has no business touching.
      #
      # --include-seed is likewise omitted: no seed data is pushed.
      - name: Apply migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase db push --db-url "$RESOLVED_DB_URL" \
              --include-all --skip-vault
          else
            npx supabase db push --linked --include-all --skip-vault
          fi

      - name: Hosted migration history
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npx supabase migration list --db-url "$RESOLVED_DB_URL" || true
          else
            npx supabase migration list --linked || true
          fi

      # HOSTED_PROBE_EMAIL_DOMAIN is optional: Supabase rejects example.com and
      # the reserved .invalid / .test TLDs, so a project may need a domain of its
      # own for the signup probes.
      - name: Prove hosted schema, RLS and two-user isolation
        run: npm run test:hosted
        env:
          HOSTED_PROBE_EMAIL_DOMAIN: ${{ secrets.HOSTED_PROBE_EMAIL_DOMAIN }}
          # The probes read the project's service-role key at run time through
          # the Management API, using the access token already present above, so
          # that key never has to be stored as a secret of its own.
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ---------------------------------------------------------------------
      # The browser half of the Iteration 2 engine.
      #
      # tests/hosted proves the API path; this proves the path a user actually
      # takes — the shipped forms, the real server actions, the same project.
      # It only runs here, because it is the only place the credentials exist.
      # Everywhere else the spec skips itself and says so.
      # ---------------------------------------------------------------------
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build against the hosted project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # All four: the per-iteration journey, the golden path that proves the
      # engines compose, group coordination, and referral. The skip guard below
      # covers every one of them — a spec that skipped would otherwise look
      # exactly like a spec that passed.
      #
      # This list is explicit rather than a directory glob, which means a new
      # engine's spec has to be added here. Leaving it out is worse than a
      # failing test: the hosted run goes green having never exercised the
      # engine, and the skip guard cannot catch a spec it was never asked to
      # run. Iteration 12 was added here in the same commit as the spec itself.
      - name: Prove the signed-in journey in a browser
        run: npx playwright test e2e/trip-onboarding.spec.ts e2e/golden-path.spec.ts e2e/group-coordination.spec.ts e2e/referral.spec.ts
        env:
          HOSTED_PROBE_EMAIL_DOMAIN: ${{ secrets.HOSTED_PROBE_EMAIL_DOMAIN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # A skip here would otherwise look like a pass. The journey spec skips
      # itself when the project is unconfigured, so this asserts it actually
      # ran — the difference between a certified engine and an unproven one.
      - name: Fail if the journey was skipped rather than run
        run: |
          if [ ! -f e2e-results.json ]; then
            echo "::error::No Playwright JSON report was written."
            exit 1
          fi
          skipped=$(node -e "
            const r = require('./e2e-results.json');
            const walk = (s) => s.flatMap(x => [...(x.specs ?? []), ...walk(x.suites ?? [])]);
            const specs = walk(r.suites ?? []);
            const states = specs.flatMap(s => s.tests ?? []).map(t => t.status);
            console.log(states.filter(x => x === 'skipped').length);
          ")
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped journey test(s) skipped. The signed-in path is NOT proven."
            exit 1
          fi
          echo "The signed-in journey ran for real."

      - name: Upload the browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-journey-report
          path: |
            e2e-results.json
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Hosted database convergence"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repo migrations | $(ls -1 supabase/migrations/*.sql | wc -l) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
